
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Учёт расходов</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <header>
      <h1>Учёт расходов</h1>
      <p>Записывайте траты и контролируйте расходы за месяц.</p>
    </header>

    <section class="card">
      <h2>Добавить трату</h2>

      <form id="expense-form">
        <label>
          Сумма, ₸
          <input id="amount" type="text"
                 inputmode="numeric"
                 placeholder="Например: 5000">
        </label>

        <label>
          Категория
          <select id="category">
            <option>Еда</option>
            <option>Транспорт</option>
            <option>Дом</option>
            <option>Другое</option>
          </select>
        </label>

        <label>
          Дата
          <input id="date" type="date">
        </label>

        <label>
          Комментарий
          <input id="comment" type="text"
                 placeholder="Необязательно">
        </label>

        <p id="error" role="alert"></p>

        <button type="submit">Добавить трату</button>
      </form>
    </section>

    <section class="card summary">
      <h2>Итого за текущий месяц</h2>
      <p id="monthly-total">0 ₸</p>
    </section>

    <section class="card">
      <h2>История расходов</h2>
      <div id="expense-list"></div>
      <p id="empty-message">
        Пока нет расходов.
      </p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
